[package]
name = "vs"
version = "0.1.0"
edition = "2021"
description = "Video Studio CLI: cloned-voice narration, audio analysis, Openverse assets, Remotion render, AutoPost publish"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
hound = "3"
rayon = "1"
ureq = { version = "2", features = ["json"] }
